# kix 运行时 overlay（`--patch` 覆盖层，宿主/profile 层）
#
# 用途：把**部署面**的宿主行挂进任意 profile，而**不动** profile 自己的
# cordis.patch.yml——0.1.1 及更早没有 @deepseek-ai/dsh-webhook，挂上去会让整棵
# 插件树装不上（fail loud）。所以这一层只在升级到 0.1.2-rc.1 之后才用：
#
#   dsh --profile web --patch /mnt/c/Users/37112/Desktop/kix-bundle/dsh/preset/patches/kix-webhook.runtime-overlay.yml --port 3080 --no-open
#
# （flag 必须放 launcher 位置：`dsh web --patch …` 会报 "web takes none of parent --patch"。）
#
# 本文件是**本机部署覆盖层**（路径/凭据引用与本机绑定），随仓库分发只作范例；
# 换机器时改下面的绝对路径与凭据引用名。
#
# ── §1 webhook 入口（webhook-runtime / webhook-github）────────────────────
#
# 需要同时做的另一件事（见 kix-webhook.reference.yml §2）：把已安装预设
# $DSH_HOME/.agent-presets/kixparadigm/agent.cordis.yml 里 kix-webhook 行的
# config.enabled 改成 true（profile patch 覆盖不到 preset 内部行）。
#
# 前置：$DSH_HOME/.credentials.yaml 的 refs 里已有 KIX_WEBHOOK_SECRET
# （2026-09-09 本机已生成并写入）。
#
# ── §2 本机回环免 token（kix-webauth，2026-09-09 用户决策）────────────────
#
# DSH web 每个进程重掷一次性 launch token，启动行打印
# `dsh web: http://127.0.0.1:<port>/?token=<每次不同>`——重启后旧书签/自动化地址必然
# 401。本机单用户部署里这条 token 只增加摩擦，故挂 kix-webauth：绑回环 + 请求 Host
# 回环时跳过浏览器认证（Host/Origin 反 DNS-rebinding 栅栏保留），回环 URL 不再带 token。
# 非回环绑定 / LAN / --trusted-host 访问自动回到上游认证。
#
# 为什么是 profile 行而不是预设行：`ctx.connection` 是宿主服务，且预设 lazy mount——
# index 请求早于任何会话，必须开机即生效。
#
# 插件源就在本仓（与覆盖层同层，不物化进预设）：dsh/preset/patches/kix-webauth.js
# 单元测试：node --test dsh/preset/plugins/kix-webauth.test.js
#
# 注意：系统服务 dsh-web.service 的 ExecStart 不带 `--patch`，走 systemd 启动时本行不生效；
# 需要时自行把上面的 `--patch <本文件>` 加进 ExecStart（运行时配置由用户维护）。
- insert:
    - id: webhook-runtime
      name: '@deepseek-ai/dsh-webhook'

    - id: webhook-github
      name: '@deepseek-ai/dsh-webhook-github'
      config:
        source: primary-github
        path: /api/kix-webhook/github
        secretEnv: KIX_WEBHOOK_SECRET
        maxBodyBytes: 262144

    # 绝对路径按本机检出位置写死（换机器改这一行）
    - id: kix-webauth
      name: /mnt/c/Users/37112/Desktop/kix-bundle/dsh/preset/patches/kix-webauth.js
