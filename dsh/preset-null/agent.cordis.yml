# ── kix 机械门禁（DSH 原生 hook）────────────────────────────────────────────
# 移植自 kixpower blast-radius/block-source-edit 核心门禁，以 tools/pre-execute
# 监听器形态自动拦截（等价 Copilot PreToolUse hook，scope-filtered 只拦本 preset）。
# v8：终端 SQL 命令位判定 + 控制平面只拦写意图（grep/cat/ls 放行）+ GitHub 前缀
# 可配置（githubToolPrefix，默认 mcp__github__）。
# v9：发布/评论/普通 push 等确认类门禁降为软约束，不再提问；硬 deny 仅保留
# 不可逆破坏性操作。单元测试 210 断言。
# v13（v1.2.15，少即是多）：控制平面 = 安装面，唯此一条定义；v3 的裸
# agent.cordis.yml 兜底分支删除——它误伤源仓库（v11/v13 两轮豁免补丁皆是
# 给它打的），而「源 vs 安装副本」本是「该相同的数份」的领域：源/外仓
# preset 写归 kix-consistency（身份组 + parity hint）管，guards 只管安装面。
# 无豁免、无谓词、无逐路径规则。诚实边界：cwd 在安装目录内的相对路径写
# 不提醒——那本就是用户显式自迭代（v12 已决策放行）。单元测试 243 断言。
# 相对路径插件由 loader 以 baseUrl 解析（name 以 "." 开头 → new URL(name, baseUrl)）。
- id: kix-guards
  name: ./plugins/kix-guards.js

# ── kix-discipline（P0 纪律机制化，2026-08-16）：需求三检/验证 gate 从
#    prompt 说教改为机制强制。吸收生态插件（dsh-doublecheck 等）的
#    「门禁+工具+持久状态」结构，不取其规则内容（kix 三检 ≠ 六维 grill）。
#    - tools/pre-execute：实现 edit 前查 spec 契约；无 spec + 首次实现编辑 →
#      remind（默认，放行+注入提醒，remindOnce）/ ask（聊天内提问）/
#      block（deny）。测试文件永远放行。
#    - kix_discipline_spec 工具：记录需求三检契约（goal/xy/assumptions/
#      path/acceptance），写工作区 kix-discipline/spec.md（跨会话可查）。
#    - agent/turn-stopping：回合结束有实现 edit 无测试运行 → green 提醒。
#    - /kix-discipline 命令：status/report/on|off。
#    强度默认 remind（限制越少越好；字面明确低风险可逆任务可忽略提醒直接做，
#    与 kix 需求三检"仅信号命中触发"一致）；block 需显式配置。
#    单元测试：node plugins/kix-discipline.test.js（68 断言，含 mode 编曲留痕）。
- id: kix-discipline
  name: ./plugins/kix-discipline.js
  disabled: true

# ── kix-orchestration（P2 补缺，2026-08-16；v2/v3 2026-08-16）：编排交接门禁机制化 ──
# 背景：Copilot 侧 kixpower 的 9 个 hooks 中只有 blast-radius 被 kix-guards 接管，
# validate-handoff 等编排纪律迁移后变"仅 prompt 约束"。本插件做有界融合：
#   - subagent 分派携带 current_sprint 时，校验工作区 docs/.kixpower-current-sprint
#     marker 一致、docs/sprint-N/{plan,progress}.md 存在、progress 无 blocker、
#     切 QA 时任务全部完成（默认 remind；ask/block 需显式配置）。
#   - v2 subagent/end：QA 返回**明确正向**完成声明但 progress.md 未同步 → steer
#     提醒（remindOnce）；v8 负向表述（not done/undone/not passed）不再误报。
#   - v3 producer_closeout 收尾证据链：spec「验收标准」在档 / 任务全完成 /
#     测试文件自 l2_verified_sha 有变更要求重验（替代 Copilot qa-signoff 深度校验
#     中可机械的部分；worktree/SHA 数学/stash 绑定 Copilot 特有流程不移植）。
# 单元测试：node plugins/kix-orchestration.test.js（96 断言；v10.1 Tri-Block [CONTEXT] Sprint N 容错；v11 plan 契约）。
- id: kix-orchestration
  name: ./plugins/kix-orchestration.js
  disabled: true

# ── kix-consistency（P5，2026-08-17；v1.2.15 泛化）：一致性守护写时拦截 ──
# CI 脚本（scripts/check-dsh-consistency.cjs）只在测试期校验，改 preset 文件时
# 不实时拦截 drift。本插件把「唯一事实源」从自觉变机械：写身份组成员时跑
# **相关子检查**，与 CI 共用 consistency-lib.cjs 单一事实源（防「CI 一套、
# 运行时一套」双源漂移）。边界自感知：preset 根 = 同时含 agent.cordis.yml +
# preset.yml 的目录（深度 ≤2 扫描）；任意仓库 ≥2 根才引导——通用层只引导
# 各根同名 plugins 字节一致（该相同的数份必须相同，N ≥ 2）；shell 写入不做
# 机械提取（命令文本启发式是负债——软启发 + CI 兜底）；其余根内路径
# （skills/agents/prompts 等翻译关系）只发 parity hint——不断言失败，把
# 「其它根对应份是否同步」交给模型判断（没说到的形态靠提醒感知）。
# 边界即 preset 根：非 preset 根路径天然出组（自感知推论，无逐路径豁免）。
# kix 全量契约（persona 预算 /
# memories 计数 / README 表述 / 版本对 / vision-bridge / 单文件语法）由仓库
# 自带 scripts 入口自声明触发，外仓不硬套。强度默认 remind（只做启发引导）；
# ask/block 需显式配置。remindOnce：每会话每类别一次。
# 单元测试：node plugins/kix-consistency.test.js（111 断言）。
- id: kix-consistency
  name: ./plugins/kix-consistency.js
  disabled: true

# ── kix-cost（v5.8 成本纪律）：机械档自动选型 + 子代理思考强度分层 ─────────
# agent/request waterfall 上：
#   A. 轻量子代理（预算帽 ≤8K，subagent_lite）首次请求探测首选路由可用性
#      （llm.listProviders + resolveModelInfo）；不可用 → 回退环境默认路由
#      （agentDefaultModel.currentSelection()）——preset 分发到不同环境不挂。
#   B. 无显式 effort 的 deepseek 子代理按预算帽注入：≥98K（subagent_thinker）
#      → max，其余 → high（默认档；64K 预算帽防跑飞——适配器默认上限 256K）。
# 主会话/GLM 子代理/显式 effort 均不干预。纯监听器、不发布服务，无需 realm。
# 见 plugins/kix-cost.js 头部注释；单元测试：node plugins/kix-cost.test.js。
- id: kix-cost
  name: ./plugins/kix-cost.js

# ── kix-route（子代理路由层）：哨兵模型名 → 运行时可用路由自动解析 ─────────
# 工具行不再钉死 (provider, model)：cross/vision/thinker 三行只钉
# `kix-route:<tier>` 哨兵，本插件在子代理首次请求的 agent/request waterfall
# 里按 llm 实时目录解析——cross = 父厂商取反、vision = 首个声明 image 输入
# 的模型、thinker = deepseek 系首选。边界语义（v5.9.1）：cross 在单厂商部署、
# vision 在无视觉模型部署启动即报错（错误信息附改用建议，带回父模型——
# 假独立性比失败更糟）；thinker 无 deepseek 时降级环境默认（角色仍成立）+
# 告警；插件缺失时哨兵直达适配器响亮失败（不静默同厂商降级）。与 kix-cost
# 顺序无关协作（effort 规则同源复用）。见 plugins/kix-route.js 头部注释；
# v8：cross 偏好表候选先过滤未注册 provider，目录探测失败不再放大为 cross 失败。
# 单元测试：node plugins/kix-route.test.js（68 断言）。
- id: kix-route
  name: ./plugins/kix-route.js

# ── presentation（PTC/Code Mode 融入）───────────────────────────────────────
# `both` = native 工具 schema 与 Code Mode SDK（run_code + tools.* 绑定）并存，
# 不声明 code-only 规则 → native 直呼照常可执行，模型自主选择形态：
#   - 单步/验证/观察动作 → native 直呼（证据可回放、门禁逐条可见）
#   - 机械多步序列/批处理/并发探测 → run_code 程序（一次往返，Promise.all 并发，
#     try/catch 容错；SDK 子分派走完整 pre-execute→guards→execute→post-execute 管线，
#     门禁依然拦截；仅 print/return 回流，中间值不可重建）
# 行等待宿主 `codeRuntime`（web-app bundle 已组装 dsh-code-runtime-worker-thread）；
# 未组装运行时的部署会在挂载时指名此 id 拒绝。
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: both

# ── kix 流程命令（P1-8：DSH 原生命令平面，2026-08 落地）────────────────
# 注册 /kixpower-new /kixpower-import /kixpower-continue /kixpower-review
# /kixpower 五个原生命令：UI 命令候选 + 零 token 触发 + handler 读
# prompts/*.prompt.md 注入 user 消息（与 /plan 命令同语义）。
- id: kix-commands
  name: ./plugins/kix-commands.js
  disabled: true

# ── kix-focus（极简 + 渐进披露 + PTC 协同，2026-08-16，三层递进）─────────
# 背景：kix 会话每轮向模型发送 85 个工具 schema（~108KB），极简模式证明
# 裁剪工具面可显著降本增效（dsh-mcp-lens 实测输入 token ↓89%、成本 ↓89%）。
# 三层递进（设计见 PLUGINIZATION-ROADMAP.md §8）：
#   Phase 1 — tools.restrict 裁剪到常驻核心集（~18 个：三通道执行/观察/
#     交互 + 发现入口），MCP（GitHub/Playwright/Context7/Semgrep）与
#     cordis_* 等宿主全局工具按需；tools/change 事件重试。
#   Phase 2 — kix_capability_search（按需目录查询，返回分组元数据不含全
#     schema）+ kix_capability_call（代理执行，经 ctx.tools.execute 走完整
#     pre-execute→guards→execute→post-execute 管线，门禁依然拦截）。
#     scope 编排工具 restrict 裁剪不到、自动可见：job_*/子代理控制保留并
#     纳入语义常驻；workflow/goal/ralph 低频重型 → 默认 disabled（2026-08-15
#     精简决策；实测 workflow 7 路并行可用，启用即用，见 delegation 组注释）。
#   Phase 3 — 保持 tool-presentation mode:both（native 直呼验证 + run_code
#     机械多步），kix 红线「验证/观察用 native 直呼（证据可回放）」不变；
#     capability_call 亦可被 run_code SDK 子分派调用（子分派过门禁）。
# 关闭裁剪（仅保留 search/call）：config: { enableRestrict: false }。
# 单元测试：node plugins/kix-focus.test.js（102 断言，含枚举同步回归防线 +
#   symlink 部署跨平台解析：候选根链 argv[1]→realpath→插件文件，2026-08-17
#   WSL2 E2E 发现修复；jobs 常驻化 + 首次使用自动激活；v1.2.13 lite 平台
#   条件化 shell + 编曲成员 current_sprint 机械注入用例）。
- id: kix-focus
  name: ./plugins/kix-focus.js

# ── kix-stalled（L3 档 A：stalled 机械检测，2026-08-15，默认注释 = opt-in）──
# 只读、无状态、无常驻：/kixst-check <项目根> 命令（零 token）+ kix_stalled_check
# 模型工具。candidate 状态（1 次夹具 E2E），真实项目证据后再考虑默认启用。
# 启用：取消下面两行注释（或运行 scripts/install-kix-stalled.ps1，由用户 shell 执行）。
# - id: kix-stalled
#   name: ./plugins/kix-stalled.js

# ── kix-signal（spec-draft 单信号，2026-08-18 三信号生 / 08-19 两轮收敛）──
# S3 spec-draft：首次源编辑无需求契约 → 注入五字段草稿模板（写作题变改错题）。
# 设计依据：提醒通道合规 2/2 vs 模型自驱 13%（349 会话对照）；与 kix-discipline
# 的 red-remind 同触发各提醒一次（discipline 提醒 + 此处脚手架），语义互补。
# S1 poll-guard / S2 orchestration-trigger 已退役（与宿主 repeat-tool-reminder /
# kix-budget streak+gate 重叠，三层证据判退——完整死亡证明见插件头注释）。
# 全 advisory 零 deny。回滚：注释下面整块并重启宿主。
- id: kix-signal
  name: ./plugins/kix-signal.js
  disabled: true
  config:
    specDraft: true

# ── kixparadigm (incentive) additions (2026-08-19, EXP1-3 findings as mechanisms) ──
# probe: neutral fresh-process executor with free duration/peak-memory telemetry
# (EXP3: correct adoption, zero cost premium, zero ritual use of placebos).
- id: kix-probe
  name: ./plugins/kix-probe.js

# settle: delivery-time steer when edits lack any post-edit execution evidence
# (L1/L4 — settlement framing, advisory, once per session).
- id: kix-settle
  name: ./plugins/kix-settle.js

# mem: pull-only crisis-indexed experience library, zero resident context
# (user-verified: agents rummage past experience when stuck).
- id: kix-mem
  name: ./plugins/kix-mem.js

# kix-browser（常驻挂载=用户裁决 2026-08-20，与默认版同步——null 变体同
# 插件面；死亡条款与完整背景见默认版注释：一个月真实使用 <2 次回退渐进披露）
- id: kix-browser
  name: ./plugins/kix-browser.js
