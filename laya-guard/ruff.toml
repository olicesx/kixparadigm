# Explicit lint contract for the laya-guard Python tooling.
#
# Deliberately local rather than inherited: kix-bundle has no other Python, so the
# result would otherwise depend on whatever ruff version happens to be installed.
# `python -m py_compile` is not a substitute for this — it only checks syntax.

line-length = 100
target-version = "py310"

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "PERF", "FURB", "RUF", "PLW", "RET", "PIE"]
ignore = [
  # Broad catches are intentional at the untrusted-input boundary: the builder walks
  # thousands of heterogeneous session files and one malformed record must not abort
  # the run. Narrowed catches are used everywhere the failure mode is actually known.
  "BLE001",
  # En/em dashes in docstrings and user-facing messages are deliberate.
  "RUF001",
  "RUF002",
  "RUF003",
]
