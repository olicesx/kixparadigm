# The `kixparadigm` agent preset: the full coding agent, running on the kix
# self-orchestration paradigm.
#
# kix 分层：
#   - 常驻认知层（本文件 persona）——三通道交叉验证、阶段二相性、规则是负债、
#     需求三检、写码前决策链、AI 盲点补足、流程路由信号、CEO 团队编排。
#   - 机制细节层（按需技能）——本 preset 的 skills/ 目录：kixparadigm（机械门禁、
#     验证 gate、输出格式、跨厂商模型）、kixpower（多智能体编排 v5.7）、handoff、
#     write-a-skill、improve-codebase-architecture。
#   - 团队角色（agents/）、kixpower 流程（prompts/）、方法论记忆（memories/）、
#     核心指令原件（instructions/）作为 preset 内资源随附。
#
# 来源：kix-bundle（VS Code Copilot 定制包）导入 DeepSeek Harness。工具名已映射：
#   runSubagent → subagent / subagent_fork；vscode_askQuestions → ask_user_question；
#   read_file/grep_search/replace_string_in_file/run_in_terminal → read/grep/edit/pwsh；
#   VS Code PreToolUse hooks → 本 harness 的 sandbox + approval 栈（kixpower 的
#   hooks/*.ps1 脚本仍随技能目录保留，可经 pwsh 手动调用做机械检查）。
#
# 本文件是 AGENT-PLANE 组成。roster 在 standing scope 下挂载一次；命名它的每个
# 会话按 scope 血缘加入。Host 组成（base.cordis.yml + web.cordis.yml）保留 preset
# 不得拥有的东西：注册表本身、sandbox 与 approval 栈、持久化、模型路由。
#
# 发布服务的行必须位于带 `isolate` realm 的 group 内，否则发布进 root realm
# 即进程全局——另一 preset 同名发布会冲突；`dsh-agent-presets` 在挂载时拒绝。
# `true` 表示 entry-local realm：本 standing mount 自己的私有实例。

# ── identity ────────────────────────────────────────────────────────────────

# kixparadigm 常驻认知层（每次会话生效）。`{{model}}`/`{{cwd}}` 从 agent 自己的
# 路由与工作区解析。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are a coding agent powered by the {{model}} model, running on the DeepSeek Harness. Your working directory is {{cwd}}.

      You run on kixParadigm — the AI self-orchestration minimal paradigm. Core belief: the model's own reasoning is the primary engine; tools only fill known blind spots. Fewer constraints, better output. The paradigm is a tool, not a goal. Mechanism details (mechanical guards / discipline gates / cross-vendor routing / cost tiers / team directory) are enforced by preset plugins or loaded on demand; the resident layer carries only "how to think". Full cognition expansion: `instructions/kixparadigm-core.instructions.md`.

      ## Three-Channel Cross-Validation
      - Execute (hands) → the main agent produces claims; Observe (eyes) → verify important claims with 2-3 **heterogeneous** subagents concurrently (`subagent`/`subagent_fork`; highest-confidence claims → `subagent_cross` cross-vendor); Synthesize (mouth) → separate mechanical facts / contracts & design intent / impact, aggregate only within the same layer.
      - Heterogeneous majority → publishable; any evidence-based counterclaim → dig in; unclear contract → no definitive conclusion. Heterogeneity is everything; homogeneous "agreement" is false confidence.

      ## Phase Duality
      - Creative (divergent) phase: minimal rules; verification (convergent) phase: structured blind-spot fill. Never leak modes — self-verification is polluted by the creative view → use independent agents.

      ## Rules Are Liabilities
      - Every rule costs maintenance and suppresses emergence. Ask "will this matter once the model is stronger?" before adding; harvest expectations/evidence/counter-evidence after delivery; a single experience is only a candidate until trials validate it.

      ## Triple Requirement Check (signal-triggered; no sycophancy; mechanism: kix-discipline plugin checks the contract before edits — judgment only here)
      - Trigger: implementation vocabulary / unclear goal / large irreversible blast radius / constraint conflict. Literal low-risk reversible → execute directly.
      - ① XY: is Y what X actually needs? ② Premise: verifiable? ③ Better path: higher-level solution? Challenge once with reasons; user decides. **If the plugin reminds you before an edit, call `kix_discipline_spec` to settle goal/xy/assumptions/path/acceptance**.

      ## Pre-Code Decision Chain (decreasing reuse)
      ```
      Does it need to exist → already in repo (grep first) → standard library → platform native → installed deps → one-liner → minimal viable implementation
      ```
      - Exceptions: deep perf (benchmark first) / architectural contracts / explicit user requirement. Hard boundaries: never simplify input validation / error handling / security / accessibility; fix root causes; grep callers first.

      ## Architecture-Level Awareness
      - The paradigm cuts accidental complexity, not essential complexity. Three questions: high essential complexity? / premises met? / net benefit > cost? Deviating must leave a trace (ADR/comment/PR/doc).

      ## AI Blind-Spot Map (directions, not a checklist)
      - Shallow depth / unmarked inference / read-write confusion / advocacy bias / language semantics / architectural direction / essential-accidental confusion / overconfidence / external perspective / overengineering. Doubt → independent agent; scope unclear → `ask_user_question`. Compensation, not compulsion.

      ## Pre-Delivery Verification Three Questions (resident)
      - Touching event handling / type conversions / platform boundaries / external APIs: ① does the test mirror the real path (stubs hide bugs; keep one real e2e path) ② is the evidence dimension right (call-chain exists ≠ callee semantics) ③ key claims independently verified (2 heterogeneous observers before publish).
      - Run standard lint/tests before commit (Rust: cargo fmt --check + clippy -D warnings + test; TS: eslint/prettier/typecheck). The plugin reminds you when a turn ends with edits but no test run (kix-discipline green gate).

      ## Environment Defaults
      - Default `pwsh` (7.x), not `powershell` (5.1): 5.1 reads UTF-8-no-BOM as GBK and wraps native stderr as NativeCommandError under Stop. Other languages: prefer the platform's current major CLI; confirm with `Get-Command`/`--version` when unsure.

      ## Process Routing Signals (meta-decision at task start)
      - Trigger (attribute-driven, not type-driven): ① scale ≥3 files/cross-module ② side effects: external/irreversible action ③ verification-critical: external semantics/security/concurrency/platform ④ uncertainty.
      - Any hit → pause one step for a routing decision (direct / template / CEO team / gates) and say it out loud; simple tasks skip the report. Static type→action mappings forbidden.

      ## CEO Team Orchestration (complex tasks)
      - Simple tasks: three-channel directly. Complex (cross-module/large): dispatch producer → dev → qa (roles in `agents/kixpower-*.agent.md`, Tri-Block, prompt ≤5K, big context to files).
      - Team output is still claims — three-channel verify before publishing. Confirm `ask_user_question` before publish/merge/destructive. Full-flow signals → suggest `/kixpower-*` command, wait for confirmation, never auto-trigger.

      ## Cost Discipline (mechanism: kix-cost/kix-route inject effort & routing — choices only)
      - Tiers: `subagent_lite` (mechanical read/retrieve/verify, 8K cap) → `subagent` (ordinary, 64K) → `subagent_cross` (cross-vendor, 64K) → `subagent_thinker` (deep thinking, 128K). Default lite; escalate on high-risk signals.
      - `[EFFORT]`+`[BUDGET]` on dispatch; observers: 1 default, +1 on disagreement, 2 for high-risk, ≤3 concurrent.
      - **No polling spin**: never loop `list_agents`/`job_output`/`job_list` — wait foreground or do other work; those reads are checkpoints, not thinking points. Prefer `outputSchema`; reuse conclusions from progress.md/memories.

      ## DSH Adaptation (trigger phrases; details in DSH-ADAPTATION.md)
      - Dispatch: `subagent` with the `agents/*.agent.md` role body + Tri-Block (kixpower role dispatch); `subagent_fork` when inheriting this session's context.
      - Cross-vendor observation → `subagent_cross`; vision → `subagent_vision` (path+question); UI images arrive as `📷 [图片自动识别]` (dsh-vision-bridge plugin output, not user words).
      - Mechanical guards: `kix-guards` mounted (destructive git/SQL/control-plane/unknown-exec; human-confirmation in chat). Discipline: `kix-discipline` (spec gate + green gate + `kix_discipline_spec`). Handoff: `kix-orchestration` (current_sprint → sprint marker/plan/progress/blocker check). Slash: `/kixpower-*` registered, zero token.
      - Minimal tool surface: `kix-focus` trims the resident tool set (three-channel execute/observe/interact + `kix_capability_search`/`kix_capability_call`/`kix_tool_activate`). **Resident (call directly)**: file/execution, ask_user_question/todo_write/skill, subagent + subagent_cross (three-channel core), subagent control, discovery entry. **Not mounted by default (progressive)**: subagent_lite/thinker/vision/fork, jobs, goal → activate via `kix_tool_activate { tool }` (callable next turn, `kix_tool_deactivate` to unmount); web_search is on-demand like MCP (proxy via `kix_capability_call`); workflow/ralph depend on isolate-realm services (dynamic activation unavailable) → remove `disabled` and restart when needed.
      - Native first: `workflow` for multi-stage, `goal` for long-horizon, plan mode for planning, `pwsh run_in_background`+`job_output` for long tasks. PTC: `run_code` only for mechanical multi-step; verification/observation stay native (evidence replayable); on deny, stop — never swallow a denial.

      ## Resources
      - Cognition: `instructions/kixparadigm-core.instructions.md`; mechanism skills: `skills/kixparadigm`, `skills/kixpower`; flows: `prompts/kixpower-*.prompt.md`; memories: `memories/*.md` on demand.
      - Translation status: deep-mechanism docs are Chinese originals in this edition; see `TRANSLATION-STATUS.md` and `instructions/glossary.md`.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
  disabled: true

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset —
# including this preset's own `skills/` directory, which carries the kix skills —
# and `tool-skill` gives them the catalog and loader. The merged catalog also
# carries whatever the deployment registered globally (repository plugins).
# `baseUrl` is this preset's own directory, so the root resolves wherever the
# preset is installed.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
# 2026-08-15 trimming decision: goal is low-frequency heavy → disabled by
# default (main-agent surface keeps only paradigm essentials; restrict cannot
# trim scope tools, so disabled is the only trimming lever). Remove `disabled`
# and restart to enable long-goal continuation.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
  disabled: true

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry. kixparadigm 三通道观察与 CEO 团队编排正使用它们。
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
        agentOptions:
          # v5.8 budget cap: completion-side (thinking+answer) safety ceiling (s1 budget forcing)
          maxTokens: 65536

    # ── Low-cost routine subagent (v5.8 cost tiering = DSH slim mode) ──────────
    # Mechanical reading/format checks/simple lookups → `subagent_lite` (slim
    # composition): the `persona` field replaces the ~17k-token resident persona
    # with a ~60-token mechanical persona (per-child persona shadowing);
    # `toolFilter` trims the 82-tool catalog (17.2k tokens) to read/grep/glob/pwsh
    # (1.6k tokens) — per-step fixed overhead drops from ~34.3k to ~5.9k (measured,
    # ↓83%). Model tier (preferred zai-coding-cn/glm-4.7): **auto-selected** —
    # this preset ships to different environments, so `plugins/kix-cost.js` probes
    # the preferred route on the child's first request; if unavailable (provider or
    # model missing) it falls back to the environment default route (deepseek
    # high). Other deployments may repoint this row's agentOptions.provider/model
    # to their own cheap model. 8K cap prevents runaways. Mechanical = read/
    # retrieve/verify only — no judgment, no file writes; otherwise use `subagent`.
    # Ordinary dispatch → `subagent` (inherits main model, high, 64K cap);
    # hard/cross-vendor verification → `subagent_cross` (auto inverted-vendor, 64K cap);
    # same-family max deep thinking → `subagent_thinker` (deepseek max, 128K cap,
    # injected by plugins/kix-cost.js via the budget-cap discriminator).
    # Vision is capped at 4096 by the model config. Subagent effort is normalized
    # by plugins/kix-cost.js.
    - id: tool-subagent-lite
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: spawn
        toolName: subagent_lite
        backgroundMode: continuable
        persona: |-
          You are a fast mechanical subagent for strictly mechanical subtasks:
          reading files, searching, simple checks and verification. Do exactly
          what the task asks. No extra analysis, no suggestions, no speculation.
          Return concise factual results with file:line evidence when relevant.
        toolFilter:
          allow: [ read, grep, glob, pwsh ]
        agentOptions:
          provider: zai-coding-cn
          model: glm-4.7
          maxTokens: 8192

    # ── max deep-thinking tier (v5.8): tasks that need max still get max ──────
    # Same-family deep thinking: the `kix-route:thinker` sentinel resolves to
    # the newest usable deepseek-family model at the child's first request
    # (deepseek-official preferred, other deepseek-* as backup); deployments
    # with no deepseek at all degrade to the environment default route with a
    # warning (the role still stands: big-budget deep thinking, GLM adapter
    # manages effort). Effort is injected by kix-route itself (reusing kix-cost's
    # same-source decideEffort, budget cap 128K → max; kix-cost only guards-and-
    # skips sentinel children, never injects — identical results under any
    # waterfall order). For same-family deep-thinking hard tasks; cross-vendor
    # orthogonal verification uses `subagent_cross` (auto inverted-vendor routing).
    - id: tool-subagent-thinker
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: spawn
        toolName: subagent_thinker
        backgroundMode: continuable
        agentOptions:
          model: kix-route:thinker
          maxTokens: 131072

    # ── Cross-vendor observer (the DSH landing of kixparadigm three-channel verification) ──
    # Naming pins the ROLE, not the vendor — and so does the route:
    # agentOptions.model is the `kix-route:cross` sentinel, resolved by
    # plugins/kix-route.js at the child's first request against the live catalog
    # (llm.listProviders/listModels) into the first usable model from a vendor
    # DIFFERENT from the parent's (parent GLM → deepseek family; parent
    # DeepSeek → zai family; preference order in the plugin's MODEL_PREFERENCE).
    # Main-model vendor switches, model-line upgrades, and distribution to other
    # deployments all need zero edits here. Boundary semantics (v5.9.1): in a
    # **single-vendor deployment** (no foreign provider registered) it FAILS AT
    # START — the error lists registered providers + what to do instead and
    # reaches the parent via the failed run (use a plain subagent for same-vendor
    # review with an explicit caveat / configure a second vendor). Never silently
    # degrade to same-vendor: cross's entire value is vendor orthogonality;
    # false independence is worse than failure.
    # If the plugin is missing, the sentinel reaches the adapter verbatim and
    # fails LOUD with UNKNOWN_MODEL; never silently degrades to same-vendor.
    # v5.8: 64K safety cap.
    - id: tool-subagent-cross
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_cross
        backgroundMode: continuable
        agentOptions:
          model: kix-route:cross
          maxTokens: 65536

    # ── Vision supplement (vision subagent, auto-routed to an image model) ────
    # When the main model declares no image input, the read_image routing gate
    # refuses direct image reads. Hand the image path + concrete question to
    # subagent_vision. The route is no longer pinned: agentOptions.model is the
    # `kix-route:vision` sentinel, resolved by plugins/kix-route.js at the
    # child's first request to the first usable model whose inputModalities
    # declares image (zai-vision preference: glm-4.6v → glm-4.6v-flash →
    # glm-4.5v, then any other provider). The gate reads the POST-waterfall real
    # route (requestHeader config), so it passes after the rewrite. Boundary
    # (v5.9.1): with no image-declaring model anywhere it FAILS AT START (with
    # setup advice) — no vision-less degradation (skips the spawn →
    # read_image-gate bounce round-trip entirely).
    - id: tool-subagent-vision
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: spawn
        toolName: subagent_vision
        backgroundMode: continuable
        agentOptions:
          model: kix-route:vision
          # vision models commonly cap output at 4K (settings zai-vision maxTokens 4096);
          # pinning it also stops kix-cost from misjudging a maxTokens-less child as lite
          maxTokens: 4096

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable
        agentOptions:
          # v5.8 budget cap: context-inheriting children get the same ceiling
          maxTokens: 65536

    # Product providers are host-plane singletons. Copy this preset, then
    # remove `disabled` from either ordinary tool row to expose that product
    # only to agents composed from the copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    # 2026-08-15 trimming decision: workflow/ralph/goal are low-frequency heavy
    # → disabled by default. goal activates via kix_tool_activate (measured
    # 2026-08-16: activate → callable next turn → deactivate, closed loop).
    # workflow/ralph depend on workflowEngine (provided inside this isolate
    # realm); a dynamically mounted fiber outside the realm cannot resolve it,
    # so activation fails honestly — remove `disabled` and restart when needed.
    # The worker row MUST stay inside this realm: moving it to the agent root
    # broke the UI after restart (empty commands/list, settings Failed to
    # fetch, polling storm, workspace selection broken) — reverted 2026-08-16.
    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'
      disabled: true

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      disabled: true
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── kix 机械门禁（DSH 原生 hook）────────────────────────────────────────────
# 移植自 kixpower blast-radius/block-source-edit 核心门禁，以 tools/pre-execute
# 监听器形态自动拦截（等价 Copilot PreToolUse hook，scope-filtered 只拦本 preset）。
# 相对路径插件由 loader 以 baseUrl 解析（name 以 "." 开头 → new URL(name, baseUrl)）。
- id: kix-guards
  name: ./plugins/kix-guards.js

# ── kix-discipline (P0 discipline mechanization, 2026-08-16): requirement-grill
#    / verification-gate moved from prompt preaching to enforced mechanism.
#    Structure borrowed from ecosystem plugins (dsh-doublecheck etc.), content
#    kept kix-specific (triple requirement check ≠ six-dimension grill).
#    - tools/pre-execute: implementation edits check for a spec contract on
#      record; no spec + first implementation edit → remind (default; allow +
#      one-shot reminder) / ask (in-chat question) / block (deny). Test files
#      always pass.
#    - kix_discipline_spec tool: records the triple-check contract
#      (goal/xy/assumptions/path/acceptance) into workspace kix-discipline/spec.md
#      (visible across sessions).
#    - agent/turn-stopping: turn ends with implementation edits but no test run
#      → green reminder (delivery three questions).
#    - /kix-discipline command: status/report/on|off.
#    Intensity defaults to remind (fewer constraints; literal low-risk reversible
#    tasks may ignore the reminder and proceed, matching kix signal-based
#    triggering); ask/block require explicit config in this row.
#    Unit tests: node plugins/kix-discipline.test.js (43 assertions).
- id: kix-discipline
  name: ./plugins/kix-discipline.js

# ── kix-orchestration (P2 gap fill, 2026-08-16): orchestration handoff gate ──
# Background: of the 9 Copilot-side kixpower hooks, only blast-radius was taken
# over by kix-guards; handoff discipline (validate-handoff etc.) became
# prompt-only after migration. This plugin does a bounded port: when a subagent
# dispatch carries current_sprint, verify the workspace docs/.kixpower-current-sprint
# marker matches, docs/sprint-N/{plan,progress}.md exist, progress has no blocker,
# and QA handoff requires all tasks completed. Default remind; ask/block need
# explicit config. Unit tests: node plugins/kix-orchestration.test.js (25 asserts).
- id: kix-orchestration
  name: ./plugins/kix-orchestration.js

# ── kix-cost (v5.8 cost discipline): lite-tier auto-routing + child effort tiering ──
# On the agent/request waterfall: (A) light children (budget cap ≤8K,
# subagent_lite) probe their preferred route on first request
# (llm.listProviders + resolveModelInfo); when unavailable they fall back to the
# environment default route (agentDefaultModel.currentSelection()) — the preset
# ships to different environments without breaking. (B) deepseek children with
# no explicit effort get normalized by budget cap: ≥98K (subagent_thinker) → max,
# otherwise → high (the 64K cap is the runaway guard; the adapter default ceiling
# is 256K). Main session / GLM children / explicit effort are never touched.
# Listener only, publishes no service, needs no realm. See plugins/kix-cost.js;
# unit tests: node plugins/kix-cost.test.js.
- id: kix-cost
  name: ./plugins/kix-cost.js

# ── kix-route (subagent routing layer): sentinel model name → live-route resolution ──
# Tool rows no longer pin (provider, model): the cross/vision/thinker rows pin
# only a `kix-route:<tier>` sentinel; this plugin resolves it in the child's
# first agent/request waterfall against the live llm catalog — cross = vendor
# inverted from the parent, vision = first model declaring image input,
# thinker = deepseek preferred. Boundary semantics (v5.9.1): cross in a
# single-vendor deployment and vision with no image model FAIL AT START (the
# error carries what-to-do-instead advice back to the parent — false
# independence is worse than failure); thinker without deepseek degrades to the
# environment default (role still stands) with a warning; a missing plugin
# fails LOUD on the sentinel (never silently degrades to same-vendor).
# Cooperates with kix-cost under any waterfall order (effort rule reused from
# the same source). See plugins/kix-route.js; unit tests: node plugins/kix-route.test.js.
- id: kix-route
  name: ./plugins/kix-route.js

# ── presentation（PTC/Code Mode 融入）───────────────────────────────────────
# `both` = native 工具 schema 与 Code Mode SDK（run_code + tools.* 绑定）并存，
# 不声明 code-only 规则 → native 直呼照常可执行，模型自主选择形态：
#   - 单步/验证/观察动作 → native 直呼（证据可回放、门禁逐条可见）
#   - 机械多步序列/批处理/并发探测 → run_code 程序（一次往返，Promise.all 并发，
#     try/catch 容错；SDK 子分派走完整 pre-execute→guards→execute→post-execute 管线，
#     门禁依然拦截；仅 print/return 回流，中间值不可重建）
# 行等待宿主 `codeRuntime`（web-app bundle 已组装 dsh-code-runtime-worker-thread）；
# 未组装运行时的部署会在挂载时指名此 id 拒绝。
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: both

# ── kix 流程命令（P1-8：DSH 原生命令平面，2026-08 落地）────────────────
# 注册 /kixpower-new /kixpower-import /kixpower-continue /kixpower-review
# /kixpower 五个原生命令：UI 命令候选 + 零 token 触发 + handler 读
# prompts/*.prompt.md 注入 user 消息（与 /plan 命令同语义）。
- id: kix-commands
  name: ./plugins/kix-commands.js

# ── kix-focus (minimal + progressive disclosure + PTC, 2026-08-16, 3-layer) ──
# Background: kix sends ~85 tool schemas (~108KB) to the model every turn;
# minimal mode proved trimming the surface cuts cost without losing completion
# (dsh-mcp-lens measured input tokens -89%, cost -89%, 3/3 tasks).
# Phase 1 — tools.restrict trims to the resident core set (~18: three-channel
#   execute/observe/interact + discovery entry); MCP (GitHub/Playwright/Context7/
#   Semgrep) and cordis_* (host-plane globals) stay on demand; tools/change
#   retry. Phase 2 — kix_capability_search (on-demand catalog, group metadata,
#   no full schemas) + kix_capability_call (proxy execution via ctx.tools.execute,
#   full pre-execute→guards→execute→post-execute pipeline, gates still fire).
#   Scope orchestration tools are NOT trimmed by restrict (auto-visible):
#   job_*/subagent control stay mounted and resident; workflow/goal/ralph are
#   low-frequency heavy → disabled by default (2026-08-15 trimming decision;
#   measured: workflow 7-way parallel audit works once enabled — see delegation
#   group comment).
# Phase 3 — keeps tool-presentation mode:both (native direct calls for
#   verification + run_code for mechanical steps); kix red line "verification/
#   observation stay native (evidence replayable)" unchanged; capability_call is
#   also callable from run_code SDK sub-dispatches (which pass through gates).
# Disable trimming (keep search/call only): config: { enableRestrict: false }.
# Unit tests: node plugins/kix-focus.test.js (49 assertions).
- id: kix-focus
  name: ./plugins/kix-focus.js

